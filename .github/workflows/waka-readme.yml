# Atualiza o bloco do WakaTime no README do perfil
name: Waka Readme

# Quando o workflow roda
on:
  # Todo dia às 3h UTC (meia-noite no horário de Brasília)
  schedule:
    - cron: '0 3 * * *'

  # Permite rodar manualmente pela aba Actions do repositório
  workflow_dispatch:

jobs:
  update-readme:
    # Máquina virtual do GitHub onde o job roda
    runs-on: ubuntu-latest

    # Permissão para a action fazer commit do README atualizado
    permissions:
      contents: write

    steps:
      # Busca as estatísticas na API do WakaTime e escreve entre os marcadores do README
      - uses: athul/waka-readme@master
        with:
          # API key guardada como secret do repositório (nunca aparece no código)
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}

          # Mostra o total de horas da semana no topo do bloco
          SHOW_TOTAL: true
